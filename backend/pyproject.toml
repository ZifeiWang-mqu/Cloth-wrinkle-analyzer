[project]
name = "illustration-wrinkle-ai-backend"
version = "0.1.0"
description = "Backend for the Illustration Wrinkle Inconsistency Detector (MVP)"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI uses function calls in argument defaults (Depends/File/Form)

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
