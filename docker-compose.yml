# docker-compose (MVP)
# Backend (FastAPI) + Frontend (Next.js dev server).
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/data
    environment:
      # Persist DB + uploads on the mounted ./data volume.
      WRINKLE_DATA_DIR: /data
      WRINKLE_CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules   # keep container's installed deps
    command: npm run dev
